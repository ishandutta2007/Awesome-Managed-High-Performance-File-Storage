<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .anim-pulse { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .anim-float1 { animation: float1 5s infinite ease-in-out; }
    .anim-float2 { animation: float2 6s infinite ease-in-out; }
    .anim-dash { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="296" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Animated Dynamic Background Elements -->
  <g class="anim-pulse" opacity="0.3">
    <circle cx="1000" cy="150" r="180" fill="url(#glowGrad)" filter="url(#glow)" />
    <circle cx="200" cy="150" r="120" fill="url(#glowGrad)" filter="url(#glow)" />
  </g>

  <!-- Flow Data Nodes -->
  <g class="anim-float1" opacity="0.7">
    <rect x="850" y="50" width="120" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="910" y="75" text-anchor="middle" class="badge">NVMe Flash</text>

    <rect x="1020" y="130" width="130" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="1085" y="155" text-anchor="middle" class="badge">Parallel POSIX</text>

    <rect x="860" y="210" width="130" height="40" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="925" y="235" text-anchor="middle" class="badge">AI / ML Pipeline</text>

    <path d="M 970 70 L 1020 150" stroke="#38bdf8" stroke-width="1.5" class="anim-dash" />
    <path d="M 1020 150 L 990 230" stroke="#818cf8" stroke-width="1.5" class="anim-dash" />
  </g>

  <!-- Faint Left Storage Grid Lines -->
  <g opacity="0.15" class="anim-float2">
    <line x1="50" y1="50" x2="350" y2="50" stroke="#38bdf8" stroke-width="2" />
    <line x1="50" y1="100" x2="350" y2="100" stroke="#38bdf8" stroke-width="2" />
    <line x1="50" y1="150" x2="350" y2="150" stroke="#38bdf8" stroke-width="2" />
    <line x1="50" y1="200" x2="350" y2="200" stroke="#38bdf8" stroke-width="2" />
    <line x1="50" y1="250" x2="350" y2="250" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Foreground Main Title & Subtitle -->
  <g transform="translate(80, 0)">
    <rect x="0" y="45" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
    <text x="110" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1">⚡ HIGH-PERFORMANCE STORAGE</text>

    <text x="0" y="125" class="title" filter="url(#glow)">Awesome Managed High-Performance File Storage</text>

    <text x="0" y="170" class="subtitle">Curated Parallel File Systems, Managed NAS &amp; Self-Hosted Storage Ecosystem</text>
    <text x="0" y="200" font-family="system-ui, sans-serif" font-weight="400" font-size="15" fill="#64748b">Benchmark, Pricing, Free Tiers &amp; Open-Source Parallel Architectures for AI/HPC</text>
    
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="55" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">🚀 Parallel I/O</text>

      <rect x="120" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="180" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">⚡ NVMe All-Flash</text>

      <rect x="250" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="305" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">🧠 AI / HPC Ready</text>
    </g>
  </g>
</svg>
